body:
  text: 提要術數類一數學之屬皇極經世索隠二卷臣等謹案皇極經世索隠二卷宋張行成撰行成字文饒一作子饒臨卭人始末不甚可考其進所著易説七種表稱自成都府路提轄司幹辦公事丐祠而歸玉海稱乾道二年六月以行成進易可採除直徽猷閣汪應辰玉山集有論鄧深按知潼川府張行成狀殆由直閣出守歟此編即所進七書之一朱彞尊經義考注云未見今見永樂大典中者别載序文總要及機要二圖而所解觀物諸篇乃散綴於邵伯温解各段之下盖割裂分附殊失其舊今摘錄叙次以還其原第遂復為完書邵子數學源出陳搏於羲文周孔之易理截然異途故嘗以其術授程子而程子不受朱子亦稱為易外别傳非専門研究其説者不能得其端緒儒者或引其書以解易或引易以解其書適以相淆不足以相發明也行成於邵子之學用力頗深以伯温之解於象數未詳復為推衍其意義故曰索隠於邵子一家之言亦可謂有所發揮矣宋史藝文志作一卷考行成進書原表自稱二卷宋史顯為字誤今以原表為據釐為二卷云乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀張行成皇極經世索隱原序先天者伏羲之易也後天者文王之易也太元者子雲之易後天之匹也皇極經世者康節之易先天之嗣也觀物篇立言廣大措意精微如繋辭然稽之以理既無不通參之以數亦無不合經世之數元㑹運世主之天而地也觀物之數聲音律吕主之地而物也夫天之運行有一十二萬九千六百之年地之生化有一十三萬八千二百四十之物物之動植有一十二萬二千八百八十之數先生之書不過萬一千六百餘言而天地之物之象之數之理否泰消長損益因革其間罔不包羅自六經以來諸子百家之作原道析理未有如此之簡要也先生之子嘗為叙述而象數未詳輙索其隱以俟同志
